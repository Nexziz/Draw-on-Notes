# Publishes the GitHub release for a version, with the files Obsidian installs, its notes from
# CHANGELOG.md, and attestations proving the files were built from this repository. It runs when a
# version tag is pushed, when a release is made on GitHub (which pushes its tag), or by hand from the
# Actions tab. Use the bare version from manifest.json, such as 0.1.0, never v0.1.0.
name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as 0.1.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The files come from the tag, so a run by hand releases what was tagged.
      - name: Take the plugin files from the tag
        run: |
          mkdir dist
          for file in main.js manifest.json styles.css versions.json; do
            git show "$TAG:$file" > "dist/$file"
          done

      - name: Check the tag matches manifest.json
        working-directory: dist
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "$TAG" != "$version" ]; then
            echo "The tag $TAG doesn't match the version $version in manifest.json."
            exit 1
          fi
          if [ "$(jq -r --arg v "$version" '.[$v] // empty' versions.json)" = "" ]; then
            echo "versions.json has no entry for $version."
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v heading="## $TAG" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $TAG."
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Publish the release with its files and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dist/main.js dist/manifest.json dist/styles.css"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md $files
          fi
